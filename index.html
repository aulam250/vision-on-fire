<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vision In Fire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: full-screen 3D canvas; HUD floats as cobalt-glazed porcelain "tiles" at the screen edges. */
:root{
  --ink:#0b1030;          /* deep indigo night */
  --glass:rgba(13,19,52,.74);
  --line:rgba(150,178,255,.24);
  --cobalt:#3a5fd0;       /* men lam (cobalt glaze) */
  --porcelain:#eef2fb;    /* sứ trắng */
  --gold:#e2b45a;         /* chỉ vàng */
  --muted:#9ea9cf;
  --hp:#e0505f; --food:#e9a23b; --en:#4fc6dc;
  --good:#79d99a; --bad:#ff7a7a;
  --display:'Playfair Display', 'Noto Serif', Georgia, serif;
  --body:'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--porcelain);font-family:var(--body);font-size:14px;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.card{background:var(--glass);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(226,180,90,.4);border-radius:999px;padding:1px 8px}
#hud{position:fixed;inset:0;pointer-events:none}
#hud .card,#hud button{pointer-events:auto}
#who{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:260px;display:grid;gap:7px}
.who-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#form-name{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:.01em}
.bar{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.track{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.track i{display:block;height:100%;width:50%;border-radius:99px;transition:width .2s}
#b-hp{background:var(--hp)}#b-hu{background:var(--food)}#b-en{background:var(--en)}
.bar b{font-variant-numeric:tabular-nums;color:var(--porcelain);font-weight:600;text-align:right}
#soul-note{font-size:12px;color:#bfe3ff;line-height:1.45}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#coins{font-variant-numeric:tabular-nums;color:var(--gold);font-size:16px}
#safe{color:var(--good);border-color:rgba(121,217,154,.45)}
#track{position:fixed;left:max(12px,env(safe-area-inset-left,0px));top:calc(190px + env(safe-area-inset-top,0px));width:260px;font-size:12.5px;line-height:1.5;display:grid;gap:4px}
#track h4{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
#track .q{color:var(--porcelain)}#track .q small{color:var(--muted)}
#sky{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:210px;display:grid;gap:6px}
.sky-row{display:flex;gap:10px;align-items:center}
#wx-icon{font-size:26px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(58,95,208,.35);border:1px solid var(--line)}
#wx-name{font-family:var(--display);font-size:17px;display:block}
#clock{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
#wx-desc,#wx-char{margin:0;font-size:11.5px;line-height:1.45;color:var(--muted)}
#wx-char{color:#cfe0ff}
#map{width:186px;height:186px;border-radius:8px;border:1px solid var(--line);display:block}
#guide{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;max-width:max(200px,min(360px,calc(100vw - 520px)));pointer-events:none!important}
#guide i{font-style:normal;font-size:22px;color:var(--gold);display:inline-block;transition:transform .15s;line-height:1}
@media (max-width:760px){#guide{top:auto;bottom:calc(215px + env(safe-area-inset-bottom,0px));max-width:calc(100vw - 40px)}}
#guide b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#guide small{color:var(--muted);font-size:11.5px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));font-size:14px;padding:8px 14px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#hint kbd,.kbd{font-family:var(--body);font-weight:700;background:var(--porcelain);color:var(--ink);border-radius:5px;padding:1px 7px;margin-right:6px}
#hint.no{color:var(--muted)}
#skills{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.sk{position:relative;width:74px;height:64px;border-radius:10px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;text-align:center;font-size:11px;line-height:1.2;padding:4px;overflow:hidden;box-sizing:border-box}
.sk .k{position:absolute;top:3px;left:5px;font-weight:700;color:var(--gold);font-size:11px}
.sk .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);height:0}
.sk.off{opacity:.4}
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:6px;justify-items:center;width:min(460px,calc(100vw - 32px))}
.toast{background:var(--glass);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;text-align:center;animation:tin .25s ease-out}
.toast.gold{border-color:rgba(226,180,90,.6);color:#ffe7b3}
.toast.bad{border-color:rgba(255,122,122,.6);color:#ffd0d0}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
#flash{position:fixed;inset:0;background:#e8f0ff;opacity:0;pointer-events:none}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(200,20,40,.55))}
#dmg-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.dn{position:absolute;font-weight:700;font-size:15px;text-shadow:0 1px 3px #000;transform:translate(-50%,-50%);white-space:nowrap}
#panel{position:fixed;inset:0;display:grid;place-items:center;background:rgba(5,8,25,.55);padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;z-index:20}
.panel-in{position:relative;width:min(620px,100%);max-height:min(82vh,760px);overflow:auto;background:linear-gradient(180deg,rgba(20,28,72,.97),rgba(11,16,46,.97));border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.panel-in h2{font-family:var(--display);font-size:26px;margin:0 0 4px;text-wrap:balance}
.panel-in h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin:18px 0 8px;font-weight:600}
.panel-in p{line-height:1.6;margin:6px 0;max-width:62ch;color:#d9e0f5}
.panel-in .sub{color:var(--muted);font-size:13px}
#p-close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--porcelain);font-size:16px;cursor:pointer}
.btn{font:inherit;font-weight:600;border:1px solid rgba(226,180,90,.55);background:rgba(226,180,90,.14);color:#ffe9bd;border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{background:rgba(226,180,90,.26)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);background:transparent;color:var(--porcelain)}
.btn:focus-visible,#p-close:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
.item b{display:block}.item small{color:var(--muted);display:block;line-height:1.4}
.price{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;margin-right:8px}
.tabs{display:flex;gap:6px;margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv span{color:var(--muted)}
.ctl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:6px 14px;font-size:13px}
.lore{font-family:var(--display);font-style:italic;font-size:17px;line-height:1.6;color:#e9edff}
#title{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 70% 50% at 50% 42%,rgba(6,8,26,.78) 0%,rgba(6,8,26,.55) 60%,rgba(5,7,24,.92) 100%);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30;box-sizing:border-box}
#title .t-mid{display:grid;justify-items:center;gap:22px;text-align:center;transform:translateY(-8vh)}
#title h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,10vw,112px);line-height:1;margin:0;letter-spacing:.01em;text-shadow:0 4px 30px rgba(255,120,40,.35),0 2px 6px rgba(0,0,0,.6);background:linear-gradient(180deg,#fff4dc 10%,#ffc56a 55%,#ff7a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#title h1 em{font-style:italic;font-weight:600}
#title .play{font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:.12em;padding:12px 64px;border:1.5px solid rgba(255,197,106,.85);background:rgba(255,140,50,.14);color:#ffe9c4;border-radius:4px;box-shadow:0 0 0 4px rgba(255,197,106,.12),0 0 30px rgba(255,120,40,.25)}
#title .play:hover{background:rgba(255,140,50,.28)}
#title .tagline{margin:0;max-width:60ch;color:#e8d8bf;letter-spacing:.06em;font-size:clamp(12px,1.6vw,15px);line-height:1.6}
#title .t-foot{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#title .t-foot label{display:flex;gap:6px;align-items:center}
#title .linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;cursor:pointer}
#touch{position:fixed;inset:0;pointer-events:none}
#joy{position:fixed;left:max(20px,env(safe-area-inset-left,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:120px;height:120px;border-radius:50%;border:1px solid var(--line);background:rgba(13,19,52,.4);pointer-events:auto;touch-action:none}
#joy i{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(238,242,251,.35)}
.charwrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}@media (max-width:560px){.charwrap{grid-template-columns:1fr}}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:8px;align-items:center;padding:8px 10px;border:1px dashed var(--line);border-radius:10px;min-height:58px}
.slot.on{border-style:solid;border-color:rgba(226,180,90,.5);background:rgba(226,180,90,.08)}
.slot .ic{grid-row:span 2;font-size:22px}.slot small{color:var(--muted);font-size:11px}.slot b{font-size:13px}.slot .btn{grid-column:1/3;padding:2px 8px;font-size:11px;margin-top:4px;justify-self:start}
.bub{position:fixed;left:0;top:0;max-width:220px;padding:6px 10px;border-radius:10px;background:rgba(250,246,236,.95);color:#2a2030;font-size:12.5px;line-height:1.35;box-shadow:0 3px 12px rgba(0,0,0,.3);transition:opacity .25s;pointer-events:none;white-space:normal;text-align:center}
.bub::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:rgba(250,246,236,.95);border-bottom:0}
.aff{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px;color:var(--muted);margin:8px 0 4px}.aff .track{height:9px}.aff i{background:linear-gradient(90deg,#ff7aa0,#ffc56a)}.aff b{color:#ffd0dc;font-weight:600}
#tk-opts .btn{padding:8px 12px}
#tbtns{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,64px);gap:10px;align-items:center;justify-items:center;pointer-events:auto}
#tbtns button.big{width:78px;height:78px;font-size:30px;background:rgba(160,60,60,.55)}#tbtns button.mid{width:60px;height:60px;font-size:18px}#tbtns button.e{background:rgba(226,180,90,.35)}#tbtns button.sm{width:48px;height:48px}
#tbtns button{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:rgba(13,19,52,.6);color:var(--porcelain);font:600 13px var(--body);touch-action:none}
@media (max-width:760px){
  #who,#track{width:190px}
  #form-name{font-size:16px}
  .bar{grid-template-columns:44px 1fr 28px;font-size:11px}
  #sky{width:150px}#map{width:148px;height:148px}
  #wx-desc,#wx-char{display:none}
  #track{top:calc(176px + env(safe-area-inset-top,0px));font-size:11.5px}
  #hint{bottom:calc(170px + env(safe-area-inset-bottom,0px));font-size:13px}
}
/* Điện thoại: gọn HUD để không đè cần điều khiển và cụm nút; mục tiêu đã có mũi tên dẫn đường */
body.touch #track{display:none}
body.touch #wx-desc,body.touch #wx-char{display:none}
body.touch #who{width:200px;padding:7px 10px;gap:4px}body.touch #form-name{font-size:15px}body.touch .bar{grid-template-columns:34px 1fr 26px;font-size:11px}
body.touch #sky{width:auto;padding:6px 8px}body.touch #wx-icon{width:28px;height:28px;font-size:18px}body.touch #wx-name{font-size:13px}body.touch #clock{font-size:10.5px}
body.touch #map{width:100px;height:100px}
@media (max-width:520px){body.touch #who{width:166px;box-sizing:border-box}body.touch #sky{box-sizing:border-box;max-width:calc(100vw - 196px)}body.touch #clock{display:block;line-height:1.3}}
@media (max-height:520px){body.touch #tbtns{grid-template-columns:repeat(3,54px);gap:7px}body.touch #tbtns button.big{width:64px;height:64px;font-size:26px}body.touch #tbtns button.mid{width:50px;height:50px}body.touch #tbtns button.sm{width:40px;height:40px;font-size:12px}
  body.touch #joy{width:104px;height:104px}body.touch #joy i{left:27px;top:27px}body.touch #guide{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto}body.touch #hint{bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="c" tabindex="0"></canvas>

<div id="hud" hidden>
  <section id="who" class="card">
    <div class="who-top"><span id="form-name">Linh Hồn Trống</span><span id="form-race" class="tag">Linh hồn</span></div>
    <div id="bars">
      <div class="bar"><span>Máu</span><div class="track"><i id="b-hp"></i></div><b id="v-hp">0</b></div>
      <div class="bar"><span>No</span><div class="track"><i id="b-hu"></i></div><b id="v-hu">0</b></div>
      <div class="bar"><span>Sức</span><div class="track"><i id="b-en"></i></div><b id="v-en">0</b></div>
    </div>
    <div id="soul-note">Bay tự do: <span class="kbd">Space</span>lên · <span class="kbd">C</span>xuống. Linh Hồn Trống không thể trao đổi hay vận sức mạnh.</div>
    <div class="row"><span style="color:var(--muted);font-size:12px">Xu</span><b id="coins">0</b><span id="safe" class="tag">Thần Sứ che chở</span></div>
    <div class="row"><button class="btn ghost" id="btn-char" style="padding:4px 10px;font-size:12px">👤 Nhân vật <span class="kbd" style="margin-left:4px">P</span></button><button class="btn ghost" id="btn-set" style="padding:4px 10px;font-size:12px" aria-label="Cài đặt">⚙️ Cài đặt</button></div>
  </section>
  <section id="track" class="card"></section>
  <section id="sky" class="card">
    <div class="sky-row"><span id="wx-icon">☀</span><div><b id="wx-name">Nắng</b><small id="clock"></small></div></div>
    <p id="wx-desc"></p>
    <p id="wx-char"></p>
    <canvas id="map" width="186" height="186"></canvas>
  </section>
  <div id="guide" class="card" hidden><i>➤</i><div><b></b><small></small></div></div>
  <div id="hint" class="card" hidden></div>
  <div id="skills">
    <div class="sk" id="sk-a"><span class="k">Chuột/F</span><span class="n"></span><div class="cd"></div></div>
    <div class="sk" id="sk-q"><span class="k">Q</span><span class="n"></span><div class="cd"></div></div>
    <div class="sk" id="sk-r"><span class="k">R</span><span class="n"></span><div class="cd"></div></div>
  </div>
  <div id="toasts"></div>
  <div id="flash"></div><div id="hurt"></div>
  <div id="dmg-layer"></div>
  <div id="touch" hidden>
    <div id="joy"><i></i></div>
    <div id="tbtns">
      <button data-t="KeyQ" class="mid">Q</button><button data-t="KeyR" class="mid">R</button><button data-t="KeyE" class="mid e">E</button>
      <button data-t="Space" class="sm">↑</button><button data-t="KeyF" class="big">⚔</button><button data-t="KeyC" class="sm">↓</button>
      <button data-t="ShiftLeft" class="sm">Chạy</button><span></span><button data-t="Menu" class="sm">☰</button>
    </div>
  </div>
</div>

<div id="panel" hidden><div class="panel-in" role="dialog" aria-modal="true"><button id="p-close" aria-label="Đóng">✕</button><div id="p-body"></div></div></div>

<div id="title">
  <div class="t-mid">
    <h1>Vision <em>In</em> Fire</h1>
    <button class="btn play" id="btn-play">Chơi</button>
    <p class="tagline">Khám phá · Chinh phục · Sống sót · Nhận ra bản chất thật của thế giới</p>
  </div>
  <div class="t-foot">
    <label><input type="checkbox" id="pace-short"> Chơi nhanh: ngày 8 phút, đêm 4 phút</label>
    <button class="linkbtn" id="btn-new" hidden>Bắt đầu hành trình mới</button>
  </div>
  <button id="btn-cont" hidden></button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js",

} }
</script>
<script type="module">
/* three.js 0.187 (MIT): WebGPURenderer + TSL. Trình duyệt có WebGPU thì chạy WebGPU, chưa có thì tự lùi về WebGL 2. Thêm ?webgl để ép WebGL 2. */

try{[THREE,T]=await Promise.all([import('three'),import('three/tsl')])}
catch(e){try{[THREE,T]=await Promise.all([import('https://unpkg.com/three@0.187.0/build/three.webgpu.js'),import('https://unpkg.com/three@0.187.0/build/three.tsl.js')])}
  catch(e2){gfxFail('Chưa tải được thư viện đồ hoạ three.js. Hãy kiểm tra kết nối mạng rồi tải lại trang.');throw e2}}
(()=>{
'use strict';
const $=s=>document.querySelector(s);
/* ================= UTIL ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const srng=mulberry32(20261107);

function groundH(x,z){const d=Math.hypot(x,z);if(d<84)return 0;const k=smooth(84,130,d);
  let h=Math.sin(x*.021)*Math.cos(z*.017)*5+Math.sin(x*.05+z*.043)*1.6+Math.cos(z*.031-x*.012)*2.2;
  const md=Math.hypot(x+215,z-150);h+=Math.max(0,1-md/70)*14; // đồi mỏ đá
  return h*k}
const CANALS=[{x0:-26,x1:-22,z0:-74,z1:74},{x0:-74,x1:74,z0:26,z1:30}];
const BRIDGES=[{x0:-27.5,x1:-20.5,z0:-2.6,z1:2.6},{x0:-2.6,x1:2.6,z0:24.5,z1:31.5}];
const inRect=(r,x,z,m=0)=>x>r.x0-m&&x<r.x1+m&&z>r.z0-m&&z<r.z1+m;
function inCanal(x,z){return CANALS.some(c=>inRect(c,x,z))&&!BRIDGES.some(b=>inRect(b,x,z))}
function onBridge(x,z){return BRIDGES.some(b=>inRect(b,x,z))}
function floorAt(x,z){if(onBridge(x,z))return .38;if(inCanal(x,z))return -.32;return groundH(x,z)}

const ROADS=[
  [[0,-80],[0,80]],[[-80,0],[80,0]],
  [[78,0],[108,-28],[128,-78],[150,-112],[168,-148]],
  [[-78,0],[-108,30],[-138,70],[-163,104],[-180,124]],
  [[0,78],[10,140],[2,230]],[[0,-78],[-10,-150],[-4,-240]],
];
function densify(pts,step){const out=[];for(let i=0;i<pts.length-1;i++){const[a,b]=[pts[i],pts[i+1]];const n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/step));for(let k=0;k<n;k++)out.push([lerp(a[0],b[0],k/n),lerp(a[1],b[1],k/n)])}out.push(pts[pts.length-1]);return out}
function distSeg(px,pz,a,b){const dx=b[0]-a[0],dz=b[1]-a[1];const t=clamp(((px-a[0])*dx+(pz-a[1])*dz)/(dx*dx+dz*dz||1),0,1);return Math.hypot(px-(a[0]+dx*t),pz-(a[1]+dz*t))}
function nearRoad(x,z,m){for(const r of ROADS)for(let i=0;i<r.length-1;i++)if(distSeg(x,z,r[i],r[i+1])<m)return true;return false}

function buildGround(){
  const geo=new THREE.PlaneGeometry(900,900,200,200);geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;const col=new Float32Array(pos.count*3);const c=new THREE.Color();
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i);const y=groundH(x,z);pos.setY(i,y);
    const n=Math.sin(x*.3)*Math.cos(z*.27)*.5+Math.sin(x*.07+z*.11)*.5;
    c.setHSL(.26+n*.02,.42,.36+n*.04);
    const d=Math.hypot(x,z);if(d<VR+4)c.setHSL(.24+n*.02,.4,.42+n*.03);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b}
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));geo.computeVertexNormals();
  const g=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1}));g.receiveShadow=true;scene.add(g);
  // đường đất
  const roadMat=new THREE.MeshStandardMaterial({color:0xa98d63,roughness:1,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-2});
  ROADS.forEach((r,i)=>{const pts=densify(r,3);const w=i<2?4.2:3.4;const P=[],I=[];
    pts.forEach((p,k)=>{const a=pts[Math.max(0,k-1)],b=pts[Math.min(pts.length-1,k+1)];const dx=b[0]-a[0],dz=b[1]-a[1];const l=Math.hypot(dx,dz)||1;const nx=-dz/l*w/2,nz=dx/l*w/2;
      P.push(p[0]+nx,groundH(p[0]+nx,p[1]+nz)+.05,p[1]+nz,p[0]-nx,groundH(p[0]-nx,p[1]-nz)+.05,p[1]-nz);
      if(k>0){const j=k*2;I.push(j-2,j-1,j,j-1,j+1,j)}});
    const gg=new THREE.BufferGeometry();gg.setAttribute('position',new THREE.Float32BufferAttribute(P,3));gg.setIndex(I);gg.computeVertexNormals();
    const m=new THREE.Mesh(gg,roadMat);m.receiveShadow=true;scene.add(m)});
}

const OB=[];const GRID=new Map();const CELL=12;
function addOb(o){OB.push(o);const x0=Math.floor((o.x0??o.x-o.r)/CELL),x1=Math.floor((o.x1??o.x+o.r)/CELL),z0=Math.floor((o.z0??o.z-o.r)/CELL),z1=Math.floor((o.z1??o.z+o.r)/CELL);
  for(let i=x0;i<=x1;i++)for(let j=z0;j<=z1;j++){const k=i+','+j;if(!GRID.has(k))GRID.set(k,[]);GRID.get(k).push(o)}}
function addBox(cx,cz,w,d,h){addOb({x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,h})}
function addCirc(x,z,r,h){addOb({x,z,r,h})}
function resolve(e,rad,y){const ci=Math.floor(e.x/CELL),cj=Math.floor(e.z/CELL);const seen=new Set();
  for(let i=ci-1;i<=ci+1;i++)for(let j=cj-1;j<=cj+1;j++){const L=GRID.get(i+','+j);if(!L)continue;
    for(const o of L){if(seen.has(o))continue;seen.add(o);if(y!==undefined&&y>o.h)continue;
      if(o.r!==undefined){const dx=e.x-o.x,dz=e.z-o.z,d=Math.hypot(dx,dz),m=o.r+rad;if(d<m&&d>1e-4){e.x=o.x+dx/d*m;e.z=o.z+dz/d*m}}
      else{const nx=clamp(e.x,o.x0,o.x1),nz=clamp(e.z,o.z0,o.z1);const dx=e.x-nx,dz=e.z-nz,d=Math.hypot(dx,dz);
        if(d<rad){if(d>1e-4){e.x=nx+dx/d*rad;e.z=nz+dz/d*rad}else{const l=e.x-o.x0,r=o.x1-e.x,t=e.z-o.z0,b=o.z1-e.z,mn=Math.min(l,r,t,b);
          if(mn===l)e.x=o.x0-rad;else if(mn===r)e.x=o.x1+rad;else if(mn===t)e.z=o.z0-rad;else e.z=o.z1+rad}}}}}}

let mapBG=null;
function drawMapBG(){const c=document.createElement('canvas');c.width=c.height=186;const g=c.getContext('2d');const s=186/520,o=93;const W=(x)=>o+x*s;
  g.fillStyle='#2d4a2c';g.fillRect(0,0,186,186);
  g.fillStyle='#4f6a3a';g.beginPath();g.arc(o,o,VR*s,0,7);g.fill();g.strokeStyle='#8a6a44';g.lineWidth=1;g.stroke();
  g.strokeStyle='#b49a6e';g.lineWidth=1.4;ROADS.forEach(r=>{g.beginPath();r.forEach((p,i)=>i?g.lineTo(W(p[0]),W(p[1])):g.moveTo(W(p[0]),W(p[1])));g.stroke()});
  g.fillStyle='#4f9ac8';CANALS.forEach(k=>g.fillRect(W(k.x0),W(k.z0),(k.x1-k.x0)*s+.6,(k.z1-k.z0)*s+.6));
  g.fillStyle='#eef2fb';g.beginPath();g.arc(o,o,2.2,0,7);g.fill();
  g.font='600 9px "Be Vietnam Pro",sans-serif';g.fillStyle='rgba(238,242,251,.85)';g.textAlign='center';g.fillText('Vùng chưa biết',o,14);mapBG=c}
function drawMap(){const cv=$('#map'),g=cv.getContext('2d');if(!mapBG)drawMapBG();g.drawImage(mapBG,0,0);const s=186/520,o=93,W=x=>o+x*s;
  const dot=(x,z,c,r=2.5)=>{g.fillStyle=c;g.beginPath();g.arc(W(x),W(z),r,0,7);g.fill()};
  for(const id in CHARS){const or=CHARS[id].origin;dot(or.x,or.z,S.chars[id].unlocked?'#9fd4ff':'#7a86a8',3.2)}
  SHARDS.forEach(sh=>{if(!S.shards[sh.zone][sh.i])dot(sh.x,sh.z,sh.zone==='forest'?'#7fffd0':'#ffb050',2.2)});
  ENEMIES.forEach(e=>dot(e.x,e.z,'#ff5a6a',1.6));JOBMAP.forEach(p=>dot(p.x,p.z,'#ffd36a',2));
  const ot=objTarget();if(ot){const r=4+Math.sin(now*.006)*1.5;g.strokeStyle='#ffd36a';g.lineWidth=2;g.beginPath();g.arc(W(ot.x),W(ot.z),r,0,7);g.stroke()}
  g.save();g.translate(W(P.x),W(P.z));g.rotate(-P.rot+Math.PI);g.fillStyle=S.form==='soul'?'#dff3ff':'#ffd36a';g.beginPath();g.moveTo(0,-5.5);g.lineTo(4,4);g.lineTo(0,2);g.lineTo(-4,4);g.closePath();g.fill();g.restore()}

let AC=null,rainGain=null;
function initAudio(){try{AC=new (window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*2,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;

const MUS={g:null,next:0,step:0,bar:0,phrase:[],bass:[],timer:null,lvl:0};
const PENTA=[0,2,4,7,9]; // Cung Thương, Giốc, Chủy, Vũ, Cung
function mNote(d){const o=Math.floor(d/5),k=((d%5)+5)%5;return 293.66*Math.pow(2,(PENTA[k]+12*o)/12)} // gốc Rê
function mPluck(t,f,dur,v){const o=AC.createOscillator(),o2=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='sawtooth';o2.type='triangle';o.frequency.value=f;o2.frequency.value=f*2.003;
  fl.type='lowpass';fl.frequency.setValueAtTime(f*6,t);fl.frequency.exponentialRampToValueAtTime(f*1.2,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(fl);o2.connect(fl);fl.connect(g).connect(MUS.g);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05)}
function mFlute(t,f,dur,v){const o=AC.createOscillator(),lfo=AC.createOscillator(),lg=AC.createGain(),g=AC.createGain();o.type='sine';o.frequency.value=f;lfo.frequency.value=5.5;lg.gain.value=f*.012;lfo.connect(lg).connect(o.frequency);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.06);g.gain.setValueAtTime(v*.8,t+dur*.7);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g).connect(MUS.g);o.start(t);lfo.start(t);o.stop(t+dur+.05);lfo.stop(t+dur+.05)}
function mDrum(t,v,f=90){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f*1.8,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.18);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g).connect(MUS.g);o.start(t);o.stop(t+.3)}
function mTick(t,v,f=2600){const s=AC.createBufferSource();s.buffer=AC.noise;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=f;fl.Q.value=6;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.06);s.connect(fl).connect(g).connect(MUS.g);s.start(t,Math.random()*1.5);s.stop(t+.08)}
function mPhrase(){let d=5+Math.floor(Math.random()*3);const p=[];for(let i=0;i<16;i++){if(Math.random()<.2&&i%4){p.push(null);continue}d+=pick([-2,-1,-1,0,1,1,2]);d=clamp(d,3,11);p.push(d)}p[15]=5;return p}
function mSchedule(){if(!AC||!MUS.g)return;const spb=60/(isNight()?92:116)/2; // nhịp móc đơn
  while(MUS.next<AC.currentTime+.25){const t=MUS.next,i=MUS.step%16;
    if(i===0){MUS.bar++;if(MUS.bar%4===1||!MUS.phrase.length)MUS.phrase=mPhrase();if(MUS.bar%8===1)MUS.bass=[0,0,3,4].map(x=>x+pick([0,0,-1]))}
    const village=P.inVillage&&started,busy=village?1:.35;
    const n=MUS.phrase[i];if(n!=null&&(village||i%2===0))mPluck(t,mNote(n),spb*1.8,.07*busy);
    if(village&&MUS.bar%8>=4&&i%4===0&&n!=null)mFlute(t,mNote(n+5),spb*3.6,.035);
    if(i%4===0)mPluck(t,mNote(MUS.bass[(i/4)|0]||0)/2,spb*3,.06*busy);
    if(village){if(i===0||i===8)mDrum(t,.22);if(i===6||i===14)mDrum(t,.12,130);if(i%2===1)mTick(t,.05);if(i===4||i===12)mTick(t,.09,900)}
    MUS.next+=spb;MUS.step++}}

function talkNPC(n,first){const A=affOf(n),pe=PERSO[n.perso];if(A.d!==S.day){A.d=S.day;A.u=[]}
  const say=first||(A.v>=45?pick(['Có chuyện gì thế bạn?','Nói đi, tôi nghe đây.']):pick(pe.greet));
  const extra=S.form==='beggar'?`<button class="btn ghost" data-beg>🪙 Xin bố thí</button>`:'';
  openPanel(`<span class="tag">${RACE_NAME[n.race]} · ${pe.n}</span><h2>${n.name}</h2>
    <div class="aff"><span>Thiện cảm</span><div class="track"><i style="width:${A.v}%"></i></div><b>${Math.round(A.v)} · ${affLv(A.v)}</b></div>
    <p class="lore" id="tk-line">"${say}"</p>
    <div class="row" id="tk-opts">${TALK_OPT.map(([k,l])=>`<button class="btn" data-o="${k}" ${A.u.includes(k)?'disabled title="Hôm nay đã nói chuyện này rồi"':''}>${l}${k==='gift'?` (${S.inv.bread||0})`:''}</button>`).join('')}${extra}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" data-close>Tạm biệt</button></div>`,el=>{
    el.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.o;
      if(k==='gift'){if(!(S.inv.bread>0)){toast('Không còn bánh mì để tặng.','bad');return}S.inv.bread--}
      let dv=pe.w[k];if(A.v<20&&(k==='joke'||k==='praise'))dv=Math.min(dv,1);const line=dv<=0?pick(pe.r.cold.concat(pe.r[k])):pick(pe.r[k]);
      A.v=clamp(A.v+dv+(k==='gift'?2:0),0,100);A.u.push(k);npcSay(n,line,5);beep(dv>0?880:240,.1,'triangle',.04,dv>0?1320:180);
      if(dv>0)dmgNum(n.x,2.8,n.z,'+'+(dv+(k==='gift'?2:0))+' ♥','#ff9ab0');talkNPC(n,line)}));
    const bg=el.querySelector('[data-beg]');if(bg)bg.addEventListener('click',()=>{if(n.begCd>0){toast('Vừa xin người này rồi.');return}n.begCd=30;
      const ch=clamp(.25+A.v/120+({perfect:.15,rain:-.1,storm:-.2}[S.weather]||0)+(n.perso==='tham'?-.2:0),.05,.95);
      if(Math.random()<ch){const c=1+Math.floor(Math.random()*(2+A.v/30));S.coins+=c;talkNPC(n,`${pick(['Cầm lấy mà mua cái bánh.','Đây này, giữ gìn sức khoẻ.','Hôm nay ta vui, cho thêm đấy.'])} (+${c} xu)`)}
      else talkNPC(n,pick(['Hôm nay ta cũng nghèo lắm.','Đi chỗ khác đi.','Để lần sau nhé.']))})})}
/* ================= INIT ================= */
function init(){buildGround();buildSky();buildVillage();buildNature();buildOrigins();buildShards();spawnVillagers();spawnAnimals();buildPlayer();setupInteractions();
  applyWeatherOnce();setForm('soul',true);P.x=0;P.z=9;P.y=1.6;
  if(loadSave())$('#btn-new').hidden=false;
  renderer.init().then(()=>{if(DEBUG)window.__gfx=renderer.backend&&renderer.backend.isWebGPUBackend?'WebGPU':'WebGL 2';requestAnimationFrame(frame)}).catch(e=>{console.error(e);gfxFail('Máy hoặc trình duyệt này chưa bật được đồ hoạ WebGPU hay WebGL 2.')})}
function begin(load){if(!AC)initAudio();if(AC&&AC.state==='suspended')AC.resume();musicOn();
  if(load){const o=loadSave();if(o){S=Object.assign(freshState(),o);S.chars=Object.assign(freshState().chars,o.chars);S.buff=Object.assign({charm:0,torch:0,warm:0},o.buff||{});S.equip=o.equip||{};S.aff=o.aff||{};if(!o.camMode)S.camMode='auto';for(const k in S.chars)if(!CHARS[k])delete S.chars[k];}}
  else{S=freshState();try{localStorage.removeItem(SAVE_KEY)}catch(e){}}
  if(!load)S.pace=$('#pace-short')?.checked?'short':'normal';setPace(S.pace||'normal',true);
  P.x=S.pos.x;P.y=S.pos.y;P.z=S.pos.z;applyWeatherOnce();setForm(S.form,true);if(S.job)setupJob();
  for(const id in crystals)crystals[id].visible=!S.chars[id].unlocked;
  $('#title').hidden=true;$('#hud').hidden=false;if(isTouch){$('#touch').hidden=false;$('#skills').hidden=true;document.body.classList.add('touch')}
  started=true;paused=false;wasVillage=true;cam.yaw=load?0:.55;camera.position.set(P.x,P.y+4,P.z+8);canvas.focus();
  if(!load)openPanel(`<span class="tag">Khởi đầu</span><h2>Linh Hồn Trống</h2><p class="lore">Ngươi mở mắt. Không tay, không chân. Chỉ là một đốm sáng dưới chân tượng Thần Sứ.</p>
    <p>Không có thân xác, ngươi không thể rời vòng bảo hộ của Thần. Bên vệ đường phía nam làng có một Kẻ Ăn Xin, thân xác trống rỗng như ngươi. Hãy bay theo <b style="color:var(--gold)">mũi tên vàng</b>.</p>
    <div class="row" style="margin-top:14px"><button class="btn" data-close>Bay đi</button></div>`);
  else toast(`Chào mừng trở lại. Ngày ${S.day}, ${WX[S.weather].name}.`,'gold')}
$('#btn-new').addEventListener('click',()=>{if(confirm('Bắt đầu lại từ đầu? Hành trình đang lưu sẽ bị xoá.'))begin(false)});$('#btn-set').addEventListener('click',()=>{if(started&&$('#panel').hidden)showSettings()});$('#btn-char').addEventListener('click',()=>{if(started&&$('#panel').hidden)showChar()});$('#btn-play').addEventListener('click',()=>begin(!!loadSave()));
addEventListener('beforeunload',()=>{if(started)save()});
if(DEBUG)window.__lh={NPCS,talkNPC,startGroup,groups,MUS,showSettings,P,get S(){return S},cam,camera,camPull,camBlocked,OB,GRID,possess,setForm,spawnEnemy,ENEMIES,objTarget,setPace,openPanel,closePanel,onKey,get paused(){return paused}};
init();
})();
</script>
